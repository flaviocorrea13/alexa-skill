name: Alexa MA Skill
version: "0.1.0"
slug: alexa_ma_skill
description: >-
  Executa a skill Alexa do Music Assistant com credenciais persistentes,
  setup assistido e diagnóstico. Requer um túnel HTTPS público.
url: https://github.com/flaviocorrea13/alexa-skill
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
backup: cold
watchdog: tcp://[HOST]:[PORT:5000]
webui: http://[HOST]:[PORT:5000]/setup
ingress: false
host_network: false
map: []
timeout: 60
ports:
  5000/tcp: 5000
options:
  PORT: "5000"
  LOCALE: pt-BR
  TZ: America/Sao_Paulo
  AWS_DEFAULT_REGION: us-east-1
  ENABLE_APL: false
  SKIP_URL_VALIDATION: false
schema:
  SKILL_HOSTNAME: str
  MA_HOSTNAME: str?
  APP_USERNAME: str?
  APP_PASSWORD: password?
  PORT: list(5000)
  LOCALE: list(pt-BR|en-US|en-GB|en-AU|en-CA|en-IN|de-DE|es-ES|es-MX|fr-FR|fr-CA|it-IT|nl-NL)
  TZ: str
  AWS_DEFAULT_REGION: str
  ENABLE_APL: bool
  SKIP_URL_VALIDATION: bool
  SKILL_ID: str?
  MA_API_URL: str?
  MA_API_TOKEN: password?
