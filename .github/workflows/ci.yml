name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and add-on validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install CI tools
        run: python -m pip install --disable-pip-version-check -r requirements_ci.txt

      - name: Validate repository metadata and docs
        run: python scripts/validate_repo.py

      - name: Check Python syntax
        run: python -m compileall -q alexa_ma_skill custom_components tests scripts

      - name: Check shell syntax
        run: bash -n alexa_ma_skill/run.sh

      - name: Run add-on unit tests
        run: python -m unittest tests.test_addon_options -v

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  integration:
    name: Integration tests (Home Assistant harness)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_test.txt

      - name: Run tests
        run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hassfest
        # Hassfest is published as a branch reference; this SHA was resolved on
        # 2026-11-23. Dependabot keeps it current.
        uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Repository topics, description and issue settings are GitHub metadata
      # and are not files. They must be configured manually before requesting
      # inclusion in the default store, so only the file-based checks run here.
      # The ignore list is space-separated (HACS Action input format).
      # The HACS Action is published as a branch reference; this SHA was
      # resolved on 2026-06-08. Dependabot keeps it current.
      - name: Run HACS Action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands description issues topics
          comment: "false"
